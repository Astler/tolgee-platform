name: Build Community Edition

on:
  push:
    branches: [ community-edition ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tolgee-community
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build Docker image
        run: ./gradlew docker -PdockerImageTag=tolgee-community:build

      - name: Tag and push Docker image
        run: |
          docker tag tolgee-community:build ghcr.io/${{ github.repository_owner }}/tolgee-community:latest
          docker push ghcr.io/${{ github.repository_owner }}/tolgee-community:latest
