name: Build Community Edition

on:
  push:
    branches: [ community-edition ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Добавляем общий таймаут

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Собираем только JAR, пропускаем ВСЁ лишнее
      - name: Build JAR
        run: |
          ./gradlew :server-app:bootJar \
            -x test \
            -x e2eTest \
            -x ktlintCheck \
            -x ktlintKotlinScriptCheck \
            --no-daemon \
            --stacktrace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Создаем Dockerfile прямо в workflow
      - name: Create Dockerfile
        run: |
          cat > Dockerfile.community << 'EOF'
          FROM eclipse-temurin:21-jre-alpine
          
          WORKDIR /app
          
          COPY backend/app/build/libs/app.jar /app/app.jar
          
          RUN mkdir -p /data && \
              addgroup -g 1001 tolgee && \
              adduser -D -u 1001 -G tolgee tolgee && \
              chown -R tolgee:tolgee /app /data
          
          USER tolgee
          
          EXPOSE 8080
          
          ENV JAVA_OPTS=""
          
          ENTRYPOINT ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]
          EOF

      # Собираем Docker образ
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.community
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tolgee-community:latest
            ghcr.io/${{ github.repository_owner }}/tolgee-community:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
